name: CPU verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q --junitxml=verification.xml
      - run: python -m compileall -q src
      - run: python scripts/validate_docs.py
      - run: python -m sanet --help
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-python-${{ matrix.python-version }}
          path: verification.xml
