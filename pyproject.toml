[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanet-research"
version = "0.1.0"
description = "Independent manuscript-driven sparse multimodal lane detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch>=2.5", "torchvision>=0.20", "numpy>=2,<3", "scipy>=1.14", "Pillow>=10", "opencv-python-headless>=4.10", "PyYAML>=6", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.scripts]
sanet = "sanet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
